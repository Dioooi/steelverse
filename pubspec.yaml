name: steelverse
description: "Pro Hardware & Tools - A comprehensive hardware store application with economic data integration."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  path: ^1.9.0
  path_provider: ^2.1.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  shared_preferences: ^2.2.0
  provider: ^6.1.0
  flutter_staggered_animations: ^1.1.0
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  url_launcher: ^6.2.0
  image_picker: ^1.0.4
  excel: ^4.0.0
  cupertino_icons: ^1.0.6
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/pic store.webp